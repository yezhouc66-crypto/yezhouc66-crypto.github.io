<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="robots" content="noindex">
    <meta name="description" content="这个页面暂时找不到了，回到早风爽的作品集继续逛逛。">
    <title>页面未找到 · 早风爽</title>
    <link id="site-icon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23faf9f6'/%3E%3Cpath d='M12 53h40M32 40l8-26' fill='none' stroke='%23b44c2c' stroke-width='4'/%3E%3Ccircle cx='40' cy='14' r='5' fill='%23b44c2c'/%3E%3C/svg%3E">
    <script>
      // 错误路径下还未定位共享脚本，先恢复主题，避免第一帧闪烁。
      try {
        const saved = localStorage.getItem("portfolio-theme");
        if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
      } catch {}
    </script>
    <style>
      /* 独立的基础样式保证多级错误路径和禁用 JS 时也能正常阅读。 */
      :root { color-scheme: light; --background: #faf9f6; --text: #282824; --muted: #686a60; --line: #deded5; --control-border: #8a8c80; --accent: #b44c2c; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) { color-scheme: dark; --background: #191a18; --text: #e8e7e0; --muted: #a4a69b; --line: #393b34; --control-border: #858b78; --accent: #e4936d; }
      }
      :root[data-theme="dark"] { color-scheme: dark; --background: #191a18; --text: #e8e7e0; --muted: #a4a69b; --line: #393b34; --control-border: #858b78; --accent: #e4936d; }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body { margin: 0; background: var(--background); color: var(--text); -webkit-font-smoothing: antialiased; }
      .page { width: min(100% - 96px, 992px); margin-inline: auto; padding-block: 46px 26px; }
      h1, p { margin: 0; }
      a { color: inherit; text-decoration: none; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 7px; border-radius: 3px; }
      .skip-link { position: fixed; top: 12px; left: 12px; z-index: 10; padding: 12px 16px; background: var(--background); transform: translateY(-200%); }
      .skip-link:focus { transform: none; }
      .site-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px 20px; color: var(--muted); font-size: 13px; }
      .site-header a { display: inline-flex; align-items: center; min-height: 44px; }
      .theme-toggle { min-height: 44px; padding: 9px 12px; border: 1px solid var(--control-border); border-radius: 4px; background: transparent; color: var(--muted); font: inherit; line-height: 1.8; cursor: pointer; }
      .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
      .error-content { max-width: 600px; padding-block: 100px 60px; }
      .error-code { margin-bottom: 16px; color: var(--accent); font-size: 18px; }
      .error-content h1 { font-size: clamp(36px, 7vw, 64px); font-weight: 650; line-height: 1.15; letter-spacing: -0.035em; }
      .error-content p:not(.error-code) { margin-top: 24px; color: var(--muted); line-height: 1.9; }
      .text-link { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
      .home-link { display: inline-flex; align-items: center; min-height: 44px; margin-top: 24px; }
      footer { display: flex; align-items: center; margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--line); }
      .github-link { display: inline-flex; align-items: center; min-height: 44px; color: var(--text); font-size: 16px; font-weight: 600; text-decoration: underline; text-underline-offset: 5px; }
      @media (max-width: 760px) { .page { width: calc(100% - 48px); padding-block: 29px 20px; } }
      @media (max-width: 359px) { .page { width: calc(100% - 40px); } }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <div class="page">
      <header class="site-header">
        <a href="https://github.com/yezhouc66-crypto">早风爽 · 作品集</a>
        <button class="theme-toggle" id="theme-toggle" type="button" hidden>主题：跟随系统</button>
      </header>
      <main class="error-content" id="main-content" tabindex="-1">
        <p class="error-code">404</p>
        <h1>这个页面走丢了。</h1>
        <p>可能是地址有误，或页面已经搬家。回到作品集，继续看看能跑起来的东西。</p>
        <a class="text-link home-link" id="home-link" href="/">返回站点根目录 →</a>
        <noscript><p>也可以返回上一页，或通过下方 GitHub 链接找到作品集。</p></noscript>
      </main>
      <footer>
        <a class="github-link" href="https://github.com/yezhouc66-crypto">GitHub</a>
      </footer>
    </div>
    <script>
      // GitHub Pages 的 404 保留原始错误 URL。向上查找带主页标识的
      // index.html，兼容未知仓库名、根站点、自定义域名与多级错误路径。
      (async () => {
        let directory = new URL("./", location.href);
        while (true) {
          try {
            const response = await fetch(new URL("index.html", directory));
            if (response.ok) {
              const page = new DOMParser().parseFromString(await response.text(), "text/html");
              const identity = page.querySelector('meta[name="application-name"]');
              if (identity?.content === "早风爽的作品集") {
                const home = document.getElementById("home-link");
                home.href = directory.href;
                home.textContent = "返回首页 →";
                const stylesheet = document.createElement("link");
                stylesheet.rel = "stylesheet";
                stylesheet.href = new URL("style.css", directory).href;
                document.head.append(stylesheet);
                document.getElementById("site-icon").href = new URL("favicon.svg", directory).href;
                const theme = document.createElement("script");
                theme.src = new URL("theme.js", directory).href;
                document.head.append(theme);
                break;
              }
            }
          } catch {
            // 请求失败仍保留独立的基础样式与站点根目录链接。
          }
          const parent = new URL("../", directory);
          if (parent.href === directory.href) break;
          directory = parent;
        }
      })();
    </script>
  </body>
</html>
