<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="robots" content="noindex">
    <meta name="description" content="作品详情页模板，供添加真实作品时复制使用。">
    <title>作品详情模板 · 早风爽的作品集</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <script src="../theme.js"></script>
    <link rel="stylesheet" href="../style.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <div class="page">
      <header class="site-header">
        <nav aria-label="页面导航"><a href="../index.html#projects-title">← 返回作品集</a></nav>
        <button class="theme-toggle" id="theme-toggle" type="button" hidden>主题：跟随系统</button>
      </header>
      <main id="main-content" tabindex="-1">
        <!-- 复制后替换所有模板说明、元数据与真实链接；发布前移除 noindex。 -->
        <article class="project-detail">
          <header class="detail-hero">
            <p class="eyebrow">模板 / 尚未填写作品</p>
            <h1>作品详情模板</h1>
            <p class="detail-lead">在这里填写真实作品名称与一句话介绍。</p>
            <!-- 有真实演示地址时，添加 .detail-actions 与 .primary-link 试玩链接。 -->
          </header>
          <section class="detail-section" aria-labelledby="overview-title">
            <div class="detail-section-heading"><p class="eyebrow" aria-hidden="true">01 / ABOUT</p><h2 id="overview-title">作品简介</h2></div>
            <div class="detail-copy"><p>说明作品的用途、适用场景与当前可用功能，只写已经确认的信息。</p></div>
          </section>
          <section class="detail-section" aria-labelledby="usage-title">
            <div class="detail-section-heading"><p class="eyebrow" aria-hidden="true">02 / PLAY</p><h2 id="usage-title">使用方式</h2></div>
            <div class="detail-copy"><p>填写实际操作步骤、键盘或触屏操作，以及必要的限制。</p></div>
          </section>
          <section class="detail-section" aria-labelledby="ideas-title">
            <div class="detail-section-heading"><p class="eyebrow" aria-hidden="true">03 / EXPLORE</p><h2 id="ideas-title">可尝试的方向</h2></div>
            <div class="detail-copy"><p>把未实现的想法明确写成“可尝试”，涉及原理时附参考来源；没有验证数据时不填写性能或实验结论。</p></div>
          </section>
          <nav class="detail-bottom-nav" aria-label="作品操作"><a class="text-link" href="../index.html#projects-title">← 返回作品集</a></nav>
        </article>
      </main>
      <footer><a class="github-link" href="https://github.com/yezhouc66-crypto">GitHub</a></footer>
    </div>
  </body>
</html>
